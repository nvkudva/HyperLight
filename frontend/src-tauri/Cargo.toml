[package]
name = "hyperlight"
version = "0.1.0"
description = "Hyperlight: private, on-device search for macOS"
authors = ["Vijay Krishna Kudva"]
license = "Proprietary"
edition = "2024"
rust-version = "1.90"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
